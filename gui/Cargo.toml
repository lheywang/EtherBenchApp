[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["image", "svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
iced_aw = { version = "0.14.1", default-features = false, features = [
    "menu",
    "tab_bar",
    "tabs",
    "number_input",
    "selection_list",
    "card",
    "badge",
] }

memory = { path = "../memory" }
device = { path = "../device" }
bindings = { path = "../bindings" }
